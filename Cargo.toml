[workspace]
members = [
  "crates/opencomp-cli",
  "crates/opencomp-agent",
  "crates/opencomp-computer",
  "crates/opencomp-browser",
  "crates/opencomp-llm",
  "crates/opencomp-vision",
  "crates/opencomp-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
tokio = { version = "1.53.2", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
  "fs",
] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"

reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

xcap = "0.9.8"
enigo = { version = "0.6.1", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
] }
base64 = "0.23.1"

playwright-rs = { version = "0.19.0", default-features = true }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde", "clock"] }

tempfile = "3.27.0"
wiremock = "0.6.5"

leptess = "0.14.0"

opencomp-core = { path = "crates/opencomp-core" }
opencomp-computer = { path = "crates/opencomp-computer" }
opencomp-browser = { path = "crates/opencomp-browser" }
opencomp-llm = { path = "crates/opencomp-llm" }
opencomp-vision = { path = "crates/opencomp-vision" }
opencomp-agent = { path = "crates/opencomp-agent" }
